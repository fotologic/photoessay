<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoEssay · Rhythm rebuild</title>
<style>
  body{ font-family:"Inter",system-ui,sans-serif; max-width:760px; margin:0 auto; padding:30px 24px 80px; color:#2a2a2a; background:#fafafa; line-height:1.5; }
  h1{ font-size:19px; margin:0 0 4px; }
  .sub{ color:#777; font-size:13px; margin-bottom:20px; }
  input{ font:inherit; padding:9px 11px; border:1px solid #ccc; border-radius:8px; width:100%; margin:6px 0 14px; }
  button{ font-family:inherit; font-weight:600; font-size:14px; border:0; border-radius:10px; padding:11px 18px; cursor:pointer; background:#2b2b30; color:#fff; }
  button:disabled{ opacity:.5; }
  .row{ background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:12px 15px; margin:9px 0; font-size:13px; }
  .ok{ color:#1a7a3a; font-weight:600; } .bad{ color:#b01a2f; font-weight:600; } .k{ color:#888; }
  pre{ background:#f2f2f2; padding:12px; border-radius:8px; overflow-x:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .out{ margin-top:18px; }
  code{ background:#eee; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<h1>Rhythm rebuild · one student</h1>
<div class="sub">Reads a shared essay Doc's version history and reconstructs the rhythm points from when it was actually edited and how it grew. Reads only; writes nothing. Produces the rhythm.json contents for you to place.</div>

<label>The student's essay <b>Doc ID</b> (from the Doc's URL, between /d/ and /edit)</label>
<input id="docid" placeholder="1AbC...xyz">
<button id="go" onclick="run()">Read the history</button>
<div class="out" id="out"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID='240073935261-aoi5q58s878gi9l61ki4apsptb9utscu.apps.googleusercontent.com';
// readonly is enough to read revisions and export content; no write scope.
const SCOPE='https://www.googleapis.com/auth/drive.readonly';
const DRIVE='https://www.googleapis.com/drive/v3';
let token=null, tokenClient=null;

window.addEventListener('load',()=>{
  const t=setInterval(()=>{
    if(window.google&&google.accounts){
      clearInterval(t);
      tokenClient=google.accounts.oauth2.initTokenClient({ client_id:CLIENT_ID, scope:SCOPE,
        callback:r=>{ if(r.error){ log('<span class="bad">Sign-in refused: '+r.error+'</span>'); return; } token=r.access_token; doRun(); } });
    }
  },100);
});
function log(html){ const d=document.createElement('div'); d.className='row'; d.innerHTML=html; document.getElementById('out').appendChild(d); return d; }
function run(){ document.getElementById('out').innerHTML=''; if(tokenClient) tokenClient.requestAccessToken({prompt:''}); }

function wordCount(text){
  return (text||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean).length;
}

async function doRun(){
  const docId=document.getElementById('docid').value.trim();
  if(!docId){ log('<span class="bad">Paste the Doc ID first.</span>'); return; }

  // 1. list revisions, asking for the exportLinks a native Google Doc revision
  //    provides (its content is not fetchable via ?alt=media, only via export).
  let revs=[];
  try{
    const FIELDS='revisions(id,modifiedTime,exportLinks),nextPageToken';
    let url=DRIVE+'/files/'+docId+'/revisions?fields='+encodeURIComponent(FIELDS)+'&pageSize=1000';
    while(url){
      const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
      if(!r.ok){ log('<span class="bad">Could not list revisions: '+r.status+'</span> '+(await r.text()).slice(0,200)); return; }
      const j=await r.json();
      revs=revs.concat(j.revisions||[]);
      url = j.nextPageToken ? DRIVE+'/files/'+docId+'/revisions?fields='+encodeURIComponent(FIELDS)+'&pageSize=1000&pageToken='+j.nextPageToken : null;
    }
  }catch(e){ log('<span class="bad">Revisions read failed: '+e.message+'</span>'); return; }

  log('Found <b>'+revs.length+'</b> revisions Google has kept for this Doc.');
  if(!revs.length){ log('No revisions available. Google may have consolidated them, in which case a rhythm cannot be rebuilt.'); return; }

  // show the raw shape of one revision so we can see how its content is reachable
  const dbg=log('<b>Raw shape of the most recent revision</b> (so we can see how to fetch its content):');
  const pre0=document.createElement('pre'); pre0.textContent=JSON.stringify(revs[revs.length-1],null,2); dbg.appendChild(pre0);

  // 2. for each revision, export the text and count words. Group to one point per DAY,
  //    taking the last revision of each day (the day's end state).
  const byDay={};
  revs.forEach(rv=>{ const day=(rv.modifiedTime||'').slice(0,10); if(day) byDay[day]=rv; });
  const days=Object.keys(byDay).sort();
  log('These fall on <b>'+days.length+'</b> distinct day(s): '+days.join(', '));

  const points=[]; const prog=log('Reading each day\u2019s word count\u2026');
  for(const day of days){
    const rv=byDay[day];
    // a native Google Doc revision exposes its content through exportLinks, keyed
    // by mime type. Prefer plain text; fall back to the export endpoint.
    const links=rv.exportLinks||{};
    const txtLink = links['text/plain'] || null;
    try{
      let txt=null;
      if(txtLink){
        const r=await fetch(txtLink,{headers:{Authorization:'Bearer '+token}});
        if(r.ok) txt=await r.text(); else prog.innerHTML+='<br><span class="k">'+day+': export link gave '+r.status+'</span>';
      }
      if(txt===null){
        // fallback: the revision export endpoint
        const r2=await fetch(DRIVE+'/files/'+docId+'/revisions/'+rv.id+'/export?mimeType=text/plain',{headers:{Authorization:'Bearer '+token}});
        if(r2.ok) txt=await r2.text(); else prog.innerHTML+='<br><span class="k">'+day+': no content ('+r2.status+')</span>';
      }
      if(txt!==null){ const w=wordCount(txt); points.push({d:day, w:w}); prog.innerHTML+='<br>'+day+': <b>'+w+'</b> words'; }
    }catch(e){ prog.innerHTML+='<br><span class="k">'+day+': '+e.message+'</span>'; }
  }

  if(points.length<2){ log('<span class="bad">Only '+points.length+' usable day(s) after export. Not enough to draw a rhythm.</span>'); return; }

  const rhythm={points:points};
  const box=log('<span class="ok">Reconstructed '+points.length+' rhythm points.</span> Below is the full rhythm.json to place in the student\u2019s folder, replacing the existing one:');
  const pre=document.createElement('pre'); pre.textContent=JSON.stringify(rhythm); box.appendChild(pre);
  log('<span class="k">To place it: open the student\u2019s shared \u201cAQA Photography Essay\u201d folder in Drive, and replace rhythm.json with a file containing exactly the text above. The dashboard will then draw her rhythm.</span>');
}
</script>
</body>
</html>
